[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fixed-perturbation-evaluator"
version = "0.1.0"
description = "Manifest-driven black-box evaluation for fixed anomaly-detection perturbations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "scipy>=1.10",
  "torch>=2.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
anomalyclip = [
  "ftfy>=6.1",
  "regex>=2023.0",
  "scikit-learn>=1.2",
  "thop>=0.1.1",
  "timm==0.6.13",
  "torchvision>=0.15",
]
aprilgan = [
  # The official repository imports these from open_clip/, model.py and
  # prompt_ensemble.py.
  "ftfy>=6.0",
  "huggingface-hub>=0.20",
  "regex>=2023.0",
  "timm>=0.9",
  "torchvision>=0.15",
  "transformers>=4.30",
]
fbclip = [
  # Weights are published only as a Google Drive folder, so gdown fetches them.
  "ftfy>=6.0",
  "gdown>=5.0",
  "regex>=2023.0",
  "timm>=0.9",
  "torchvision>=0.15",
]
tipsomaly = [
  # model/omaly imports jax at module scope even on the TIPS path, and the TIPS
  # tokenizer is a sentencepiece model. xformers is optional and guarded.
  "jax>=0.4",
  "sentencepiece>=0.2",
  "torchvision>=0.15",
]
vcpclip = [
  # Weights are published as individual Google Drive files, so gdown fetches
  # them; the official models/ package imports these directly.
  "ftfy>=6.0",
  "gdown>=5.0",
  "regex>=2023.0",
  "scikit-learn>=1.2",
  # gaussian_filter(axes=...), which calcuate_metric uses, needs scipy 1.11.
  "scipy>=1.11",
  "torchvision>=0.15",
]
crane = [
  # The official repository imports these from models/ and utils/.
  "ftfy>=6.0",
  "humanhash3>=0.0.6",
  "opencv-python>=4.8",
  "regex>=2023.0",
  "scikit-image>=0.20",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "torchmetrics>=1.0",
  "torchvision>=0.15",
]
faprompt = [
  # Weights are published only as a Google Drive folder, so gdown fetches them.
  "ftfy>=6.0",
  "gdown>=5.0",
  "iopath>=0.1.9",
  "regex>=2023.0",
  "thop>=0.1",
  "timm>=0.9",
  "torchvision>=0.15",
]
adaclip = [
  # The official repository imports these from method/, tools/ and loss.py.
  "ftfy>=6.0",
  "huggingface-hub>=0.20",
  "matplotlib>=3.6",
  "opencv-python>=4.8",
  "pandas>=1.5",
  "regex>=2023.0",
  "scikit-image>=0.20",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "seaborn>=0.12",
  "timm>=0.9",
  "torchvision>=0.15",
  "transformers>=4.30",
]
aaclip = [
  "einops==0.7.0",
  "ftfy==6.2.0",
  # model/adapter_modules.py, model/transformer.py, and forward_utils.py all
  # import ipdb unconditionally, so the official repository cannot be loaded
  # without it even though its requirements.txt omits it.
  "ipdb>=0.13",
  "kornia==0.6.9",
  "opencv-python>=4.8",
  "pandas>=1.5",
  # model/tokenizer.py imports regex, also missing from the official list.
  "regex>=2023.0",
  "scikit-learn>=1.2",
  "tiktoken==0.7.0",
  "timm==0.6.12",
  "torchvision>=0.15",
]

[project.scripts]
fpeval = "fpeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
